<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07141a" />
    <title>Komicats Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: #07141a;
        color: #ffffff;
      }
      .card {
        width: min(100%, 420px);
        text-align: center;
        border: 1px solid rgba(103, 232, 249, 0.2);
        background: rgba(8, 23, 31, 0.9);
        border-radius: 20px;
        padding: 28px 22px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
        line-height: 1.6;
      }
      .status {
        margin-top: 18px;
        font-size: 13px;
        color: rgba(165, 243, 252, 0.75);
      }
      .actions {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }
      button {
        border: 1px solid rgba(34, 211, 238, 0.28);
        background: rgba(6, 182, 212, 0.12);
        color: #d9faff;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        cursor: pointer;
      }
      button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>
        Your internet connection is unavailable. Reconnect and try again. Cached
        pages may still open once the app is back online.
      </p>
      <div id="status" class="status">Waiting for connection...</div>
      <div class="actions">
        <button id="retry" hidden>Go back to app</button>
      </div>
    </main>

    <script>
      (function () {
        const status = document.getElementById("status");
        const retry = document.getElementById("retry");

        function updateStatus() {
          const online = navigator.onLine;
          status.textContent = online
            ? "Connection restored."
            : "Waiting for connection...";
          retry.hidden = !online;
        }

        retry.addEventListener("click", function () {
          window.location.replace("/");
        });

        window.addEventListener("online", updateStatus);
        window.addEventListener("offline", updateStatus);
        updateStatus();
      })();
    </script>
  </body>
</html>
