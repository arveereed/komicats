<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#27484e" />
    <meta name="color-scheme" content="dark" />
    <title>Komicats Downloads</title>
    <style>
      :root {
        --bg: #04080b;
        --bg-gradient: linear-gradient(
          to bottom,
          #27484e 0%,
          #11262b 55%,
          #020507 100%
        );
        --panel: rgba(255, 255, 255, 0.05);
        --panel-strong: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.7);
        --muted-soft: rgba(255, 255, 255, 0.5);
        --accent: #67e8f9;
        --success: #34d399;
        --warning-bg: rgba(250, 204, 21, 0.1);
        --warning-border: rgba(250, 204, 21, 0.2);
        --warning-text: rgb(254, 240, 138);
        --button-secondary: #35505b;
        --button-secondary-hover: #40606d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
      }

      body.modal-open {
        overflow: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
      }

      img {
        max-width: 100%;
      }

      [hidden] {
        display: none !important;
      }

      .page-root {
        min-height: 100vh;
        background: var(--bg);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text);
      }

      .container {
        width: 100%;
        max-width: 80rem;
        margin: 0 auto;
      }

      .downloads-shell,
      .plain-state-shell {
        min-height: 100vh;
        background: var(--bg);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text);
      }

      .downloads-shell-header {
        position: sticky;
        top: 0;
        z-index: 50;
        margin-bottom: 24px;
        width: 100%;
        border-bottom: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.95);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }

      .downloads-shell-header-inner {
        display: flex;
        height: 64px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 16px;
      }

      .downloads-shell-back,
      .downloads-shell-spacer {
        width: 36px;
        min-width: 36px;
      }

      .downloads-shell-back {
        display: inline-flex;
        height: 36px;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        color: #fff;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .downloads-shell-back:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .downloads-shell-back:active {
        transform: scale(0.97);
      }

      .downloads-shell-title-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex: 1;
        min-width: 0;
      }

      .downloads-header-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .downloads-header-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .downloads-page {
        position: relative;
        margin: 0 auto;
        width: 100%;
        max-width: 80rem;
        padding: 0 16px 24px;
        color: #fff;
      }

      .downloads-notice {
        margin-bottom: 16px;
        border: 1px solid var(--warning-border);
        border-radius: 12px;
        background: var(--warning-bg);
        padding: 12px 16px;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--warning-text);
      }

      .downloads-empty,
      .downloads-loading,
      .plain-state {
        display: flex;
        min-height: 240px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        padding: 24px;
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
      }

      .plain-state-shell {
        display: grid;
        padding: 24px;
      }

      .plain-state {
        align-self: center;
        max-width: 32rem;
        justify-self: center;
      }

      .downloads-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .download-card {
        display: block;
        overflow: hidden;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        transition:
          background 0.3s ease,
          transform 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      .download-card:hover {
        background: var(--panel-strong);
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 22px 40px rgba(0, 0, 0, 0.38);
      }

      .download-card-cover {
        position: relative;
        aspect-ratio: 3 / 4;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.05);
      }

      .download-card-cover img,
      .download-card-cover video,
      .download-card-cover-placeholder,
      .hero-image,
      .hero-video,
      .hero-placeholder {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .download-card-cover img,
      .download-card-cover video,
      .hero-image,
      .hero-video {
        object-fit: cover;
      }

      .download-card-cover video,
      .hero-video {
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .download-card-cover img,
      .hero-image {
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }

      .download-card-cover-placeholder,
      .hero-placeholder {
        background: rgba(255, 255, 255, 0.05);
      }

      .download-card:hover .download-card-cover img {
        transform: scale(1.05);
      }

      .download-card.playing .download-card-cover img,
      .hero-preview.playing .hero-image {
        opacity: 0;
      }

      .download-card.playing .download-card-cover video,
      .hero-preview.playing .hero-video {
        opacity: 1;
      }

      .download-card-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.95),
          rgba(0, 0, 0, 0.25),
          transparent
        );
      }

      .download-card-body {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        z-index: 2;
        padding: 12px;
      }

      .download-card-title {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        font-size: 0.875rem;
        font-weight: 800;
        line-height: 1.25;
        text-transform: uppercase;
        color: #fff;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        text-shadow:
          0 2px 10px rgba(0, 0, 0, 0.9),
          0 1px 2px rgba(0, 0, 0, 0.8);
      }

      .download-card-meta {
        margin: 4px 0 0;
        font-size: 0.75rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.8);
      }

      .download-card-status {
        margin: 8px 0 0;
        font-size: 0.6875rem;
        font-weight: 500;
        color: var(--success);
      }

      .downloads-toast {
        position: fixed;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom, 0px) + 16px);
        z-index: 120;
        transform: translateX(-50%) translateY(16px);
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 10px 14px;
        font-size: 0.875rem;
        color: #fff;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          transform 0.22s ease;
      }

      .downloads-toast.is-visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .details-page {
        min-height: 100vh;
        background: #04080b;
        color: #fff;
      }

      .details-hero-wrap {
        position: relative;
      }

      .details-hero {
        position: relative;
        min-height: 720px;
        overflow: hidden;
        background: #000;
      }

      .details-bg-radial {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at top,
          #1a2f36 0%,
          #0d171b 42%,
          #05080b 100%
        );
      }

      .details-bg-dark {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.2);
      }

      .details-back {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 30;
      }

      .back-button,
      .reader-top-back,
      .reader-icon-button,
      .sheet-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        color: white;
        transition: background 0.2s ease;
      }

      .back-button {
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }

      .back-button:hover,
      .reader-top-back:hover,
      .reader-icon-button:hover,
      .sheet-close:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .details-hero-media {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        padding-bottom: 260px;
      }

      .hero-preview {
        position: relative;
        height: 72vh;
        min-height: 520px;
        width: 100%;
        overflow: hidden;
        background: #000;
      }

      .hero-preview-overlay-1 {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          #071015,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.2)
        );
      }

      .hero-preview-overlay-2 {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          rgba(7, 16, 21, 0.65),
          transparent,
          rgba(7, 16, 21, 0.65)
        );
      }

      .details-bottom-panel-wrap {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        z-index: 20;
      }

      .details-bottom-panel {
        border-top: 1px solid var(--border);
        background: linear-gradient(
          180deg,
          rgba(18, 29, 34, 0.78) 0%,
          rgba(8, 14, 18, 0.96) 100%
        );
        padding: 16px 16px 24px;
        backdrop-filter: blur(14px);
      }

      .details-bottom-panel-inner,
      .details-content-inner {
        max-width: 64rem;
        margin: 0 auto;
      }

      .details-title {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
      }

      .details-meta {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.8);
      }

      .details-age {
        border-radius: 0.25rem;
        background: rgba(255, 255, 255, 0.15);
        padding: 2px 6px;
        font-size: 10px;
        font-weight: 500;
      }

      .details-button-stack {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .button-primary,
      .button-secondary,
      .button-outline,
      .empty-button {
        width: 100%;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 4px;
        padding: 10px 16px;
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          opacity 0.2s ease;
      }

      .button-primary {
        background: #fff;
        color: #000;
      }

      .button-primary:hover {
        background: rgba(255, 255, 255, 0.92);
      }

      .button-primary.is-disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .button-secondary,
      .empty-button {
        border-color: var(--border);
        background: var(--button-secondary);
        color: #fff;
      }

      .button-secondary:hover,
      .empty-button:hover {
        background: var(--button-secondary-hover);
      }

      .button-outline {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }

      .button-outline:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .details-description-wrap {
        margin-top: 16px;
      }

      .details-description {
        margin: 0;
        max-width: 56rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.75);
      }

      .details-description.is-collapsed {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
        overflow: hidden;
      }

      .details-description-toggle {
        margin-top: 8px;
        color: var(--accent);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }

      .details-content {
        position: relative;
        z-index: 10;
        margin-top: -8px;
        padding: 0 16px 32px;
      }

      .details-tabbar {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .details-tab-active {
        border-bottom: 2px solid var(--accent);
        padding-bottom: 12px;
        color: #fff;
      }

      .details-episodes {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .details-empty-card {
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: var(--panel);
        padding: 20px;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.7);
      }

      .episode-row-link {
        display: block;
      }

      .episode-row {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        border-radius: 1rem;
        padding: 8px;
        transition: background 0.2s ease;
      }

      .episode-row:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .episode-thumb {
        position: relative;
        width: 80px;
        min-width: 80px;
        height: 96px;
        overflow: hidden;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.1);
      }

      .episode-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }

      .episode-row:hover .episode-thumb img {
        transform: scale(1.05);
      }

      .episode-thumb-empty {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.5);
      }

      .episode-main {
        min-width: 0;
        flex: 1;
        padding-top: 4px;
      }

      .episode-title {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 1.25rem;
        font-weight: 600;
        color: white;
        line-height: 1.2;
      }

      .episode-desc {
        margin-top: 8px;
        font-size: 1rem;
        line-height: 1.65;
        color: rgba(255, 255, 255, 0.85);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }

      .episode-pages {
        margin-top: 8px;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.55);
      }

      .details-footer-label {
        margin-top: 32px;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.5);
      }

      .reader-page-shell {
        min-height: 100vh;
        background: var(--bg);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: #fff;
      }

      .reader-topbar {
        position: fixed;
        inset-inline: 0;
        top: 0;
        z-index: 60;
        border-bottom: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(16px);
      }

      .reader-topbar-inner {
        max-width: 72rem;
        margin: 0 auto;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        gap: 12px;
      }

      .reader-top-left,
      .reader-top-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .reader-top-back,
      .reader-icon-button {
        width: 36px;
        height: 36px;
        background: transparent;
      }

      .reader-icon-button img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      .reader-top-center {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .reader-top-comic,
      .reader-top-episode {
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin: 0;
      }

      .reader-top-comic {
        font-size: 0.9rem;
        font-weight: 600;
      }

      .reader-top-episode {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.7);
      }

      .reader-main {
        max-width: 72rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 8px 96px;
      }

      .reader-pages-wrap {
        width: 100%;
        padding-top: 56px;
      }

      .reader-page-item {
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .reader-page-item img {
        width: 100%;
        display: block;
        height: auto;
        object-fit: contain;
      }

      .reader-bottom-fixed {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        z-index: 50;
        border-top: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
      }

      .reader-bottom-inner {
        max-width: 64rem;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        gap: 12px;
      }

      .reader-bottom-spacer {
        flex: 1;
      }

      .reader-nav {
        display: flex;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.05);
      }

      .reader-nav-btn,
      .reader-nav-disabled {
        width: 56px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.8);
      }

      .reader-nav-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .reader-nav-disabled {
        color: rgba(255, 255, 255, 0.3);
      }

      .empty-card {
        margin-top: 40px;
        width: 100%;
        max-width: 28rem;
        border-radius: 1.5rem;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        padding: 32px;
        text-align: center;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }

      .empty-card-reader {
        margin-top: 88px;
      }

      .empty-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .empty-desc {
        margin-top: 8px;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
      }

      .empty-actions {
        margin-top: 24px;
      }

      .sheet-backdrop,
      .dialog-backdrop {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(2, 6, 23, 0.72);
      }

      .sheet-panel,
      .dialog-panel {
        position: fixed;
        z-index: 80;
        background: rgb(2, 6, 23);
        border: 1px solid var(--border);
        color: white;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      }

      .sheet-panel {
        top: 0;
        right: 0;
        height: 100vh;
        width: min(90vw, 28rem);
        transform: translateX(100%);
        transition: transform 0.24s ease;
        display: flex;
        flex-direction: column;
      }

      .sheet-panel.is-open {
        transform: translateX(0);
      }

      .dialog-panel {
        left: 50%;
        top: 50%;
        width: min(92vw, 36rem);
        border-radius: 1rem;
        opacity: 0;
        transform: translate(-50%, -46%);
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          transform 0.22s ease;
      }

      .dialog-panel.is-open {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }

      .sheet-header,
      .dialog-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--border);
      }

      .sheet-title,
      .dialog-title {
        margin: 0;
        font-size: 1.125rem;
